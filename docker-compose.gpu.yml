services:
  agent3-rocm:
    build:
      context: .
      dockerfile: gpu/Dockerfile.rocm
    ports:
      - "8790:8790"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      - AGENT3_HOST=0.0.0.0
      - AGENT3_PORT=8790
